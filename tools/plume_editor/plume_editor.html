<title>Seat Plume Workshop</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-screen workshop. 3D test stand on the left, a placard-style control rack on the right (stacked on phones). */
:root {
  --bg: #e9ebe8;
  --panel: #f6f7f4;
  --panel-2: #eceeea;
  --line: #cdd1cb;
  --fg: #1c201d;
  --muted: #5d655f;
  --accent: #f2b31b;          /* ejection-handle yellow */
  --accent-ink: #191714;
  --stripe-dark: #1b1b19;
  --ok: #2f7d4f;
  --bad: #b3402c;
  --field: #ffffff;
  --display: "Barlow Semi Condensed", "Arial Narrow", "Segoe UI", sans-serif;
  --body: "Barlow", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121513; --panel: #1a1e1b; --panel-2: #222723; --line: #323933; --fg: #e5e8e3; --muted: #97a098;
    --accent: #f2b31b; --accent-ink: #191714; --stripe-dark: #0c0d0c; --ok: #5cbf83; --bad: #e0745f; --field: #121513;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121513; --panel: #1a1e1b; --panel-2: #222723; --line: #323933; --fg: #e5e8e3; --muted: #97a098;
  --accent: #f2b31b; --accent-ink: #191714; --stripe-dark: #0c0d0c; --ok: #5cbf83; --bad: #e0745f; --field: #121513;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 14px; overflow: hidden; }
.app { display: flex; height: 100%; min-height: 0; }
.stage { position: relative; flex: 1; min-width: 0; background: #0d1014; }
.stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.hud { position: absolute; left: calc(12px + env(safe-area-inset-left, 0px)); top: 12px; display: flex; gap: 8px; flex-wrap: wrap; right: 12px; pointer-events: none; }
.hud > * { pointer-events: auto; }
.chip { font-family: var(--mono); font-size: 12px; color: #e8ebe6; background: rgba(10, 12, 14, 0.62); border: 1px solid rgba(255,255,255,0.14); padding: 5px 9px; border-radius: 4px; backdrop-filter: blur(4px); }
.stagebar { position: absolute; left: calc(12px + env(safe-area-inset-left, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); right: 12px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.fire-btn { font-family: var(--display); font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; font-size: 15px; color: var(--accent-ink); border: 0; border-radius: 4px; padding: 9px 16px; cursor: pointer;
  background: repeating-linear-gradient(-45deg, var(--accent) 0 12px, #e6a40f 12px 24px); box-shadow: inset 0 0 0 2px var(--stripe-dark); }
.fire-btn:focus-visible, .btn:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible, .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ghost { font-family: var(--body); font-size: 13px; color: #e8ebe6; background: rgba(10,12,14,0.62); border: 1px solid rgba(255,255,255,0.18); border-radius: 4px; padding: 7px 11px; cursor: pointer; }
.ghost[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.ghost-select { font-family: var(--body); font-size: 13px; color: #e8ebe6; background: rgba(10,12,14,0.72); border: 1px solid rgba(255,255,255,0.18); border-radius: 4px; padding: 6px 8px; }

.rack { width: 380px; flex: 0 0 380px; display: flex; flex-direction: column; min-height: 0; background: var(--panel); border-left: 1px solid var(--line); }
.placard { padding-block: 12px 10px; padding-left: 16px; padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line); }
.stripe { height: 6px; background: repeating-linear-gradient(-45deg, var(--accent) 0 9px, var(--stripe-dark) 9px 18px); }
h1 { font-family: var(--display); font-weight: 700; font-size: 22px; letter-spacing: 0.02em; margin: 0; text-wrap: balance; }
.sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
.seatrow { display: flex; gap: 8px; margin-top: 10px; align-items: center; }
.seatrow select { flex: 1; min-width: 0; }
select, input[type="text"], textarea { font-family: var(--body); font-size: 14px; color: var(--fg); background: var(--field); border: 1px solid var(--line); border-radius: 4px; padding: 7px 8px; }
.tabs { display: flex; border-bottom: 1px solid var(--line); background: var(--panel-2); overflow-x: auto; }
.tab { flex: 1 0 auto; font-family: var(--display); font-weight: 600; font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); background: none; border: 0; border-bottom: 2px solid transparent; padding: 9px 10px; cursor: pointer; }
.tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.scroll { flex: 1; min-height: 0; overflow-y: auto; padding-block: 6px 14px; padding-left: 16px; padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.group { padding-block: 10px 4px; border-bottom: 1px dashed var(--line); }
.group:last-child { border-bottom: 0; }
.group h2 { font-family: var(--display); font-weight: 600; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
.row { display: grid; grid-template-columns: 112px 1fr 64px; gap: 8px; align-items: center; padding: 4px 0; }
.row label { font-size: 13px; color: var(--fg); }
.row .hint { grid-column: 1 / -1; color: var(--muted); font-size: 12px; margin-top: -2px; }
.row input[type="range"] { width: 100%; accent-color: var(--accent); min-width: 0; }
.row input[type="number"] { width: 100%; font-family: var(--mono); font-size: 12px; color: var(--fg); background: var(--field); border: 1px solid var(--line); border-radius: 3px; padding: 4px 5px; font-variant-numeric: tabular-nums; }
.row input[type="color"] { width: 100%; height: 28px; border: 1px solid var(--line); border-radius: 3px; background: var(--field); padding: 1px; }
.row .hex { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.readout { font-family: var(--mono); font-size: 12px; color: var(--muted); padding: 4px 0 8px; font-variant-numeric: tabular-nums; }
.btn { font-family: var(--display); font-weight: 600; font-size: 14px; letter-spacing: 0.04em; border-radius: 4px; padding: 8px 12px; cursor: pointer; border: 1px solid var(--line); background: var(--panel-2); color: var(--fg); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--stripe-dark); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btnrow { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
textarea { width: 100%; box-sizing: border-box; font-family: var(--mono); font-size: 12px; line-height: 1.45; min-height: 200px; resize: vertical; }
.field { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }
.field label { font-size: 13px; color: var(--muted); }
.status { font-size: 13px; margin-top: 8px; min-height: 18px; }
.status.ok { color: var(--ok); } .status.bad { color: var(--bad); }
.sent { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.sent li { display: grid; grid-template-columns: 1fr auto; gap: 6px; align-items: center; padding: 8px; border: 1px solid var(--line); border-radius: 4px; background: var(--panel-2); }
.sent .name { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.sent .meta { font-family: var(--mono); font-size: 11px; color: var(--muted); grid-column: 1; }
.sent .btn { grid-row: 1 / span 2; grid-column: 2; padding: 6px 10px; font-size: 13px; }
.empty { color: var(--muted); font-size: 13px; padding: 6px 0; }
@media (max-width: 820px) {
  body { overflow: auto; }
  .app { flex-direction: column; height: auto; }
  .stage { height: 56vh; min-height: 320px; flex: none; }
  .rack { width: auto; flex: none; border-left: 0; border-top: 1px solid var(--line); }
  .scroll { overflow: visible; }
  .placard { padding-left: max(16px, env(safe-area-inset-left, 0px)); }
  .scroll { padding-left: max(16px, env(safe-area-inset-left, 0px)); }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<div class="app">
  <div class="stage" id="stage">
    <div class="hud">
      <span class="chip" id="chipSeat">ACES II</span>
      <span class="chip" id="chipSize">flame 1.26 m × 0.39 m</span>
      <span class="chip" id="chipFps">— fps</span>
      <span class="chip" id="chipModel">loading game models…</span>
    </div>
    <div class="stagebar">
      <button class="fire-btn" id="fireBtn" type="button">Fire motor</button>
      <button class="ghost" id="loopBtn" type="button" aria-pressed="true">Loop burn</button>
      <select class="ghost-select" id="skySel" aria-label="Lighting">
        <option value="day">Daylight</option>
        <option value="dusk" selected>Dusk</option>
        <option value="night">Night</option>
      </select>
      <button class="ghost" id="kerbalBtn" type="button" aria-pressed="true">Kerbal</button>
      <button class="ghost" id="viewBtn" type="button">Reset view</button>
    </div>
  </div>

  <aside class="rack">
    <div class="stripe" aria-hidden="true"></div>
    <div class="placard">
      <h1>Seat Plume Workshop</h1>
      <div class="sub">Tune the seat rocket, fit it to the nozzle, then upload it for the mod.</div>
      <div class="seatrow">
        <select id="seatSel" aria-label="Seat"></select>
        <button class="btn" id="resetBtn" type="button">Reset seat</button>
      </div>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-fit" aria-selected="true" data-tab="fit">Fit</button>
      <button class="tab" role="tab" id="tab-flame" aria-selected="false" data-tab="flame">Flame</button>
      <button class="tab" role="tab" id="tab-fx" aria-selected="false" data-tab="fx">Fire &amp; sparks</button>
      <button class="tab" role="tab" id="tab-smoke" aria-selected="false" data-tab="smoke">Smoke</button>
      <button class="tab" role="tab" id="tab-send" aria-selected="false" data-tab="send">Upload</button>
    </div>
    <div class="scroll" id="panels"></div>
  </aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function () {
"use strict";

// ---------------------------------------------------------------- seats (mirrors Source/SeatModel.cs)
const SEAT_SCALE = 0.68;
const PIVOT = [0, -0.04, -0.235];
function rotX(deg, v) { const a = deg * Math.PI / 180, c = Math.cos(a), s = Math.sin(a); return [v[0], v[1] * c - v[2] * s, v[1] * s + v[2] * c]; } // Unity AngleAxis(deg, right)
function back(tilt, x, h, d) { const r = rotX(tilt, [x, h, d]); return [PIVOT[0] + r[0], PIVOT[1] + r[1], PIVOT[2] + r[2]]; }
const C = (r, g, b) => [r, g, b];
const ERA = {
  modern:  { core: C(1, 0.96, 0.86), mid: C(1, 0.70, 0.28), outer: C(1, 0.34, 0.07), len: 1.05, wid: 0.92 },
  coldwar: { core: C(1, 0.90, 0.66), mid: C(1, 0.56, 0.15), outer: C(1, 0.25, 0.04), len: 1.2,  wid: 1.05 },
  ww2:     { core: C(1, 0.82, 0.50), mid: C(1, 0.46, 0.11), outer: C(0.90, 0.20, 0.04), len: 0.55, wid: 1.15 },
};
const SEATS = [
  { id: "modern",  era: "modern",  title: "ACES II", tilt: -13, pal: [C(0.60,0.62,0.62), C(0.40,0.42,0.43), C(0.30,0.32,0.31), C(0.27,0.28,0.30)],
    nozzles: [[[0, -0.205, -0.075], [0, -1, -0.2], 0.72]] },
  { id: "us16e",   era: "modern",  title: "Martin-Baker US16E", tilt: -16, pal: [C(0.25,0.255,0.27), C(0.33,0.34,0.36), C(0.17,0.175,0.19), C(0.30,0.31,0.33)],
    nozzles: [[[0, -0.235, -0.09], [0, -1, -0.2], 0.72]] },
  { id: "k36",     era: "modern",  title: "Zvezda K-36D", tilt: -15, pal: [C(0.31,0.34,0.33), C(0.36,0.40,0.36), C(0.34,0.43,0.31), C(0.25,0.26,0.27)],
    nozzles: [[[-0.09, -0.25, -0.10], [-0.05, -1, -0.2], 0.66], [[0.09, -0.25, -0.10], [0.05, -1, -0.2], 0.66]] },
  { id: "coldwar", era: "coldwar", title: "Martin-Baker Mk 4/5", tilt: -15, pal: [C(0.25,0.265,0.275), C(0.34,0.36,0.32), C(0.66,0.58,0.42), C(0.30,0.31,0.32)],
    nozzles: [[[-0.11, -0.235, -0.13], [-0.08, -1, -0.22], 0.68], [[0.11, -0.235, -0.13], [0.08, -1, -0.22], 0.68]] },
  { id: "mk7",     era: "coldwar", title: "Martin-Baker Mk 7", tilt: -15, pal: [C(0.15,0.155,0.16), C(0.30,0.34,0.25), C(0.38,0.45,0.28), C(0.30,0.31,0.32)],
    nozzles: [[[-0.11, -0.235, -0.13], [-0.08, -1, -0.22], 0.68], [[0.11, -0.235, -0.13], [0.08, -1, -0.22], 0.68]] },
  { id: "km1",     era: "coldwar", title: "KM-1", tilt: -14, pal: [C(0.60,0.70,0.68), C(0.44,0.54,0.53), C(0.60,0.58,0.50), C(0.46,0.47,0.47)],
    nozzles: [[back(-14, 0, -0.2, -0.075), rotX(-14, [0, -1, -0.06]), 0.74]] },
  { id: "ww2",     era: "ww2",     title: "Heinkel He 162", tilt: -20, pal: [C(0.66,0.68,0.67), C(0.50,0.52,0.50), C(0.36,0.39,0.25), C(0.72,0.73,0.72)],
    nozzles: [[back(-20, 0, -0.27, -0.105), rotX(-20, [0, -1, -0.05]), 0.7]] },
  { id: "he219",   era: "ww2",     title: "Heinkel He 219", tilt: -13, pal: [C(0.34,0.37,0.33), C(0.26,0.28,0.25), C(0.27,0.17,0.11), C(0.48,0.49,0.48)],
    nozzles: [[back(-13, 0.262, 0.03, -0.055), rotX(-13, [0.06, -1, -0.08]), 0.62]] },
];
const lerp = (a, b, t) => a + (b - a) * t;
const lerpC = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const norm = v => { const l = Math.hypot(v[0], v[1], v[2]) || 1; return [v[0] / l, v[1] / l, v[2] / l]; };

// ---------------------------------------------------------------- parameters (mirrors the EJECTION_PLUME config node)
const PARAMS = [
  { tab: "fit", group: "Nozzle position", key: "offX", label: "Sideways", min: -0.15, max: 0.15, step: 0.002, unit: "m", hint: "Twin nozzles move apart (+) or together (−)." },
  { tab: "fit", group: "Nozzle position", key: "offY", label: "Up / down", min: -0.15, max: 0.15, step: 0.002, unit: "m" },
  { tab: "fit", group: "Nozzle position", key: "offZ", label: "Fore / aft", min: -0.15, max: 0.15, step: 0.002, unit: "m", hint: "+ moves the flame start forward, under the pan." },
  { tab: "fit", group: "Nozzle angle", key: "pitch", label: "Pitch", min: -45, max: 45, step: 0.5, unit: "°", hint: "+ swings the exhaust forward, − throws it further back." },
  { tab: "fit", group: "Nozzle angle", key: "splay", label: "Splay", min: -30, max: 30, step: 0.5, unit: "°", hint: "Twin nozzles: + angles them outward. Single nozzle: + leans it to the seat's right." },

  { tab: "flame", group: "Size", key: "flameLength", label: "Length", min: 0.2, max: 3, step: 0.01, unit: "×" },
  { tab: "flame", group: "Size", key: "flameWidth", label: "Width", min: 0.2, max: 3, step: 0.01, unit: "×" },
  { tab: "flame", group: "Size", key: "coreLength", label: "Core length", min: 0.1, max: 1.2, step: 0.01, unit: "×", hint: "Share of the flame length taken by the white-hot core." },
  { tab: "flame", group: "Size", key: "coreWidth", label: "Core width", min: 0.1, max: 1.2, step: 0.01, unit: "×" },
  { tab: "flame", group: "Colour", key: "coreColor", label: "Core", type: "color" },
  { tab: "flame", group: "Colour", key: "flameColor", label: "Flame", type: "color" },
  { tab: "flame", group: "Colour", key: "edgeColor", label: "Edge", type: "color" },
  { tab: "flame", group: "Brightness", key: "bodyOpacity", label: "Flame body", min: 0, max: 1.5, step: 0.01, unit: "" },
  { tab: "flame", group: "Brightness", key: "outerOpacity", label: "Outer halo", min: 0, max: 1.5, step: 0.01, unit: "" },
  { tab: "flame", group: "Brightness", key: "flicker", label: "Flicker speed", min: 0.2, max: 3, step: 0.01, unit: "×" },
  { tab: "flame", group: "Nozzle glow & light", key: "glowSize", label: "Glow size", min: 0, max: 4, step: 0.01, unit: "×W" },
  { tab: "flame", group: "Nozzle glow & light", key: "glowBrightness", label: "Glow brightness", min: 0, max: 1.5, step: 0.01, unit: "" },
  { tab: "flame", group: "Nozzle glow & light", key: "lightRange", label: "Light range", min: 0, max: 20, step: 0.1, unit: "m" },
  { tab: "flame", group: "Nozzle glow & light", key: "lightIntensity", label: "Light strength", min: 0, max: 4, step: 0.01, unit: "×" },

  { tab: "fx", group: "Churning fire", key: "fireRate", label: "Rate", min: 0, max: 800, step: 5, unit: "/s" },
  { tab: "fx", group: "Churning fire", key: "fireSize", label: "Blob size", min: 0.1, max: 3, step: 0.01, unit: "×" },
  { tab: "fx", group: "Churning fire", key: "fireSpeed", label: "Speed", min: 0.1, max: 3, step: 0.01, unit: "×" },
  { tab: "fx", group: "Churning fire", key: "fireLife", label: "Lifetime", min: 0.1, max: 4, step: 0.01, unit: "×" },
  { tab: "fx", group: "Churning fire", key: "fireSpread", label: "Spread", min: 0, max: 40, step: 0.5, unit: "°" },
  { tab: "fx", group: "Sparks", key: "sparkRate", label: "Rate", min: 0, max: 800, step: 5, unit: "/s" },
  { tab: "fx", group: "Sparks", key: "sparkSpeed", label: "Speed", min: 0.1, max: 3, step: 0.01, unit: "×" },
  { tab: "fx", group: "Sparks", key: "sparkLife", label: "Lifetime", min: 0.1, max: 4, step: 0.01, unit: "×" },
  { tab: "fx", group: "Sparks", key: "sparkSpread", label: "Spread", min: 0, max: 60, step: 0.5, unit: "°" },

  { tab: "smoke", group: "Trail", key: "smokeAmount", label: "Amount", min: 0, max: 3, step: 0.01, unit: "×" },
  { tab: "smoke", group: "Trail", key: "smokeLife", label: "Hang time", min: 1, max: 30, step: 0.5, unit: "s", hint: "The preview caps the particle count, so very long trails thin out here before they would in game." },
  { tab: "smoke", group: "Trail", key: "smokeSize", label: "Puff size", min: 0.2, max: 3, step: 0.01, unit: "×" },
  { tab: "smoke", group: "Trail", key: "smokeStart", label: "Starts at", min: 0, max: 1.5, step: 0.01, unit: "×L", hint: "Where the smoke begins along the flame (0 = nozzle)." },
  { tab: "smoke", group: "Trail", key: "smokeOpacity", label: "Opacity", min: 0, max: 1.5, step: 0.01, unit: "" },
  { tab: "smoke", group: "Trail", key: "smokeColor", label: "Colour", type: "color" },
  { tab: "smoke", group: "Preview only", key: "airspeed", label: "Airspeed", min: 0, max: 200, step: 1, unit: "m/s", preview: true, hint: "How fast the seat climbs away from its own smoke. Not saved." },
];

function defaults(seat) {
  const e = ERA[seat.era];
  return {
    offX: 0, offY: 0, offZ: 0, pitch: 0, splay: 0,
    flameLength: e.len, flameWidth: e.wid, coreLength: 0.55, coreWidth: 0.55,
    coreColor: lerpC(e.core, [1, 1, 1], 0.45), flameColor: lerpC(e.mid, e.core, 0.55), edgeColor: lerpC(e.outer, e.mid, 0.5),
    bodyOpacity: 0.7, outerOpacity: 0.4, flicker: 1,
    glowSize: 1.7, glowBrightness: 0.55, lightRange: 7, lightIntensity: 1,
    fireRate: 260, fireSize: 1, fireSpeed: 1, fireLife: 1, fireSpread: 9,
    sparkRate: Math.round(160 * e.len), sparkSpeed: 1, sparkLife: 1, sparkSpread: 18,
    smokeAmount: 1, smokeLife: 9, smokeSize: 1, smokeStart: 0.45, smokeOpacity: 1, smokeColor: [0.96, 0.95, 0.93],
    airspeed: 40,
  };
}

// ---------------------------------------------------------------- state
let seat = SEATS[0];
let P = defaults(seat);
const saved = {};
function storeGet(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
function storeSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
(function restore() {
  const s = storeGet("plume-workshop-v1");

function smokeGrow(t) { return gradient([[0, 1], [0.05, 3.6], [0.35, 7.5], [1, 11]], t); }

// ---------------------------------------------------------------- burn simulation (SeatRocketFX.Update/SetThrust)
let thrusting = false, thrustAge = 0, power = 0, smokePower = 0, burnClock = 0, loop = true;
const BURN = 2.2, PAUSE = 2.6;
const acc = { fire: 0, spark: 0, smoke: 0 };
function ignite() { thrusting = true; thrustAge = 0; burnClock = 0; for (const n of nozzles) for (let i = 0; i < 30; i++) emitSmoke(n); }
function emitSmoke(n) {
  const L = 1.2 * P.flameLength, start = n.pos.clone().addScaledVector(n.axis, 0.45 * P.flameLength * (P.smokeStart / 0.45));
  const life = Math.max(1, P.smokeLife);
  smokeSys.add({ pos: start.addScaledVector(coneDir(n.axis, 60), Math.random() * 0.05), vel: coneDir(n.axis, 8).multiplyScalar(rnd(5, 11)),
    age: 0, life: rnd(life * 0.7, life * 1.15), size: rnd(0.55, 0.9) * P.smokeSize, rot: Math.random() * 6.28, spin: rnd(-0.25, 0.25),
    base: Math.random() < 0.5 ? 1 : 0.84 });
}

let last = performance.now(), fpsT = 0, fpsN = 0;
const camFwd = new THREE.Vector3(), camUp = new THREE.Vector3(), toCam = new THREE.Vector3(), m4 = new THREE.Matrix4(), bx = new THREE.Vector3(), by = new THREE.Vector3();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  fpsT += dt; fpsN++; if (fpsT > 0.5) { chipFps.textContent = Math.round(fpsN / fpsT) + " fps"; fpsT = 0; fpsN = 0; }
  controls.update();

  // burn cycle
  burnClock += dt;
  if (thrusting && burnClock > BURN) { thrusting = false; burnClock = 0; }
  else if (!thrusting && loop && burnClock > PAUSE) ignite();
  thrustAge += dt;
  const target = thrusting ? 1 + 0.45 * Math.exp(-thrustAge * 11) : 0;
  power = moveTowards(power, target, dt * (thrusting ? 16 : 6));
  smokePower = thrusting ? 1 : moveTowards(smokePower, 0, dt / 1.6);
  fireBtn.textContent = thrusting ? "Burning…" : "Fire motor";

  // flame sheets
  camera.getWorldDirection(camFwd); camUp.set(0, 1, 0).applyQuaternion(camera.quaternion);
  const t = now / 1000;
  for (const n of nozzles) {
    for (const f of n.sheets) {
      const visible = power > 0.01; f.mesh.visible = visible; if (!visible) continue;
      toCam.copy(camera.position).sub(n.pos);
      const rate = f.rate * P.flicker;
      const n1 = perlin(f.seed, t * rate), n2 = perlin(f.seed + 7, t * rate * 0.63);
      const along = Math.abs(n.axis.dot(toCam.clone().normalize()));
      let brightness, sx, sz, zAxis, yAxis;
      if (f.glow) {
        zAxis = camUp.clone(); yAxis = camFwd.clone().negate();
        const size = f.wid * (0.75 + 0.5 * n1) * (0.6 + 0.6 * along) * Math.sqrt(power);
        sx = size; sz = size; brightness = (0.35 + 0.65 * along) * (0.75 + 0.25 * n2);
      } else {
        zAxis = n.axis.clone();
        yAxis = toCam.clone().addScaledVector(n.axis, -toCam.dot(n.axis)); if (yAxis.lengthSq() < 1e-6) yAxis.set(0, 0, 1); yAxis.normalize();
        sx = f.wid * (0.86 + 0.28 * n1) * Math.sqrt(power); sz = f.len * (0.9 + 0.18 * n2) * power; brightness = 0.78 + 0.3 * n2;
      }
      bx.crossVectors(yAxis, zAxis).normalize(); by.copy(yAxis);
      m4.makeBasis(bx.multiplyScalar(sx), by, zAxis.multiplyScalar(sz)); m4.setPosition(n.pos); f.mesh.matrix.copy(m4);
      const k = Math.min(1, Math.max(0, brightness * Math.min(1, power)));
      const col = f.mesh.geometry.attributes.color;
      for (let i = 0; i < 4; i++) col.setXYZ(i, f.tint[0] * k, f.tint[1] * k, f.tint[2] * k);
      col.needsUpdate = true;
    }
    n.light.intensity = moveTowards(n.light.intensity, power * (1.1 + Math.random() * 0.5) * P.lightIntensity * 2.2, dt * 40);
    n.light.distance = P.lightRange; n.light.color.setRGB(...P.flameColor);
  }

  // emission
  const L = 1.2 * P.flameLength, W = 0.42 * P.flameWidth;
  const climb = new THREE.Vector3(0, P.airspeed, 0); // the seat climbs away from the air (and its smoke)
  if (thrusting) {
    acc.fire += dt * P.fireRate; acc.spark += dt * P.sparkRate;
    for (; acc.fire >= 1; acc.fire--) for (const n of nozzles)
      fireSys.add({ pos: n.pos.clone(), vel: coneDir(n.axis, P.fireSpread).multiplyScalar(rnd(5 * L, 8 * L) * P.fireSpeed), age: 0, life: rnd(0.1, 0.2) * P.fireLife,
        size: rnd(W * 0.45, W * 0.75) * P.fireSize, rot: Math.random() * 6.28, spin: rnd(-4, 4), c0: lerpC(P.coreColor, P.flameColor, Math.random()) });
    for (; acc.spark >= 1; acc.spark--) for (const n of nozzles)
      sparks.push({ pos: n.pos.clone(), vel: coneDir(n.axis, P.sparkSpread).multiplyScalar(rnd(5 * L, 13 * L) * P.sparkSpeed), age: 0, life: rnd(0.25, 0.7) * P.sparkLife, c0: lerpC(P.coreColor, P.flameColor, Math.random()) });
  } else { acc.fire = 0; acc.spark = 0; }
  if (smokePower > 0) {
    acc.smoke += dt * (70 + 1.4 * P.airspeed) * P.smokeAmount * smokePower;
    for (; acc.smoke >= 1; acc.smoke--) for (const n of nozzles) emitSmoke(n);
  }

  // fire: local to the seat
  fireSys.p = fireSys.p.filter(q => (q.age += dt) < q.life);
  for (const q of fireSys.p) { q.pos.addScaledVector(q.vel, dt); q.rot += q.spin * dt; }
  fireSys.write((q, i, s) => {
    const k = q.age / q.life;
    const c = gradient([[0, [1, 1, 1]], [0.35, P.flameColor], [1, P.edgeColor]], k);
    const a = gradient([[0, 0.9], [0.45, 0.75], [1, 0]], k);
    s.pos.set([q.pos.x, q.pos.y, q.pos.z], i * 3); s.size[i] = q.size * easeInOut(0.7, 2.1, k); s.rot[i] = q.rot;
    s.col.set([c[0] * q.c0[0], c[1] * q.c0[1], c[2] * q.c0[2], a], i * 4);
  });

  // sparks: world space (stretched by velocity)
  sparks = sparks.filter(q => (q.age += dt) < q.life);
  if (sparks.length > SPARK_MAX) sparks.splice(0, sparks.length - SPARK_MAX);
  let si = 0;
  for (const q of sparks) {
    q.pos.addScaledVector(q.vel, dt); q.pos.addScaledVector(climb, -dt);
    const k = q.age / q.life, c = lerpC([1, 1, 1], P.edgeColor, k), a = (1 - k);
    const len = 0.03 * 1.3 + q.vel.length() * 0.02 * 0.6;
    const tail = q.pos.clone().addScaledVector(q.vel.clone().normalize(), -len);
    sparkPos.set([q.pos.x, q.pos.y, q.pos.z, tail.x, tail.y, tail.z], si * 6);
    sparkCol.set([c[0] * q.c0[0] * a, c[1] * q.c0[1] * a, c[2] * q.c0[2] * a, 0, 0, 0], si * 6); si++;
  }
  sparkGeo.setDrawRange(0, si * 2); sparkGeo.attributes.position.needsUpdate = true; sparkGeo.attributes.color.needsUpdate = true;

  // smoke: lives in the air, so it slides away from the climbing seat
  smokeSys.p = smokeSys.p.filter(q => (q.age += dt) < q.life);
  const damp = 1 - Math.pow(1 - 0.3, dt * 60);
  for (const q of smokeSys.p) {
    const sp = q.vel.length(); if (sp > 0.6) q.vel.multiplyScalar((sp - (sp - 0.6) * damp) / sp);
    q.pos.addScaledVector(q.vel, dt); q.pos.addScaledVector(climb, -dt); q.rot += q.spin * dt;
  }
  const sc = P.smokeColor;
  smokeSys.write((q, i, s) => {
    const k = q.age / q.life;
    let c = gradient([[0, [1, 0.8, 0.52]], [0.04, sc], [1, [sc[0] * 0.875, sc[1] * 0.884, sc[2] * 0.892]]], k);
    const a = gradient([[0, 0], [0.02, 0.95], [0.25, 0.8], [0.6, 0.42], [0.85, 0.12], [1, 0]], k) * (q.base > 0.9 ? 0.9 : 0.7);
    // smoke is lit by the scene, not glowing: dim it at night
    const amb = hemi.intensity * 0.9 + sun.intensity * 0.55 + 0.08 + power * 0.25 * P.lightIntensity * Math.max(0, 1 - q.pos.distanceTo(nozzles[0] ? nozzles[0].pos : q.pos) / Math.max(0.1, P.lightRange));
    const lit = Math.min(1.1, amb);
    s.pos.set([q.pos.x, q.pos.y, q.pos.z], i * 3); s.size[i] = q.size * smokeGrow(k); s.rot[i] = q.rot;
    s.col.set([c[0] * q.base * lit, c[1] * q.base * lit, c[2] * q.base * lit, Math.min(1, a * P.smokeOpacity)], i * 4);
  }, camera.position);

  const scale = renderer.domElement.height / (2 * Math.tan(camera.fov * Math.PI / 360));
  fireSys.mat.uniforms.scale.value = scale; smokeSys.mat.uniforms.scale.value = scale;
  renderer.render(scene, camera);
}
function moveTowards(a, b, d) { return Math.abs(b - a) <= d ? b : a + Math.sign(b - a) * d; }
function resize() { const w = stage.clientWidth, h = stage.clientHeight; renderer.setSize(w, h, false); camera.aspect = w / Math.max(1, h); camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(stage);

// ---------------------------------------------------------------- UI
const $ = id => document.getElementById(id);
const chipSeat = $("chipSeat"), chipSize = $("chipSize"), chipFps = $("chipFps"), chipModel = $("chipModel"), fireBtn = $("fireBtn");
const seatSel = $("seatSel");
for (const s of SEATS) { const o = document.createElement("option"); o.value = s.id; o.textContent = s.title; seatSel.appendChild(o); }
seatSel.value = seat.id;
const hexOf = c => "#" + c.map(v => Math.round(Math.min(1, Math.max(0, v)) * 255).toString(16).padStart(2, "0")).join("");
const rgbOf = h => [1, 3, 5].map(i => parseInt(h.substr(i, 2), 16) / 255);
const fmt = (v, step) => { const d = step >= 1 ? 0 : step >= 0.1 ? 1 : step >= 0.01 ? 2 : 3; return Number(v).toFixed(d); };

const panels = $("panels");
const tabEls = {};
const inputs = {};
for (const tabId of ["fit", "flame", "fx", "smoke"]) {
  const tab = document.createElement("div"); tab.dataset.panel = tabId; tab.setAttribute("role", "tabpanel"); tab.hidden = tabId !== "fit"; panels.appendChild(tab); tabEls[tabId] = tab;
  if (tabId === "fit") {
    const p = document.createElement("div"); p.className = "readout"; p.id = "fitReadout"; tab.appendChild(p);
  }
  let group = null, groupName = "";
  for (const prm of PARAMS.filter(x => x.tab === tabId)) {
    if (prm.group !== groupName) { group = document.createElement("div"); group.className = "group"; const h = document.createElement("h2"); h.textContent = prm.group; group.appendChild(h); tab.appendChild(group); groupName = prm.group; }
    const row = document.createElement("div"); row.className = "row";
    const id = "p-" + prm.key;
    const lab = document.createElement("label"); lab.htmlFor = id; lab.textContent = prm.label + (prm.unit ? " (" + prm.unit + ")" : ""); row.appendChild(lab);
    if (prm.type === "color") {
      const c = document.createElement("input"); c.type = "color"; c.id = id; row.appendChild(c);
      const hx = document.createElement("span"); hx.className = "hex"; row.appendChild(hx);
      c.addEventListener("input", () => { P[prm.key] = rgbOf(c.value); hx.textContent = c.value; changed(prm); });
      inputs[prm.key] = { set: v => { c.value = hexOf(v); hx.textContent = c.value; } };
    } else {
      const r = document.createElement("input"); r.type = "range"; r.id = id; r.min = prm.min; r.max = prm.max; r.step = prm.step; row.appendChild(r);
      const n = document.createElement("input"); n.type = "number"; n.step = prm.step; n.id = id + "-n"; n.setAttribute("aria-label", prm.label + " value"); row.appendChild(n);
      r.addEventListener("input", () => { P[prm.key] = +r.value; n.value = fmt(r.value, prm.step); changed(prm); });
      n.addEventListener("change", () => { const v = parseFloat(n.value); if (!isFinite(v)) return; P[prm.key] = v; r.value = v; changed(prm); });
      inputs[prm.key] = { set: v => { r.value = v; n.value = fmt(v, prm.step); } };
    }
    if (prm.hint) { const h = document.createElement("div"); h.className = "hint"; h.textContent = prm.hint; row.appendChild(h); }
    group.appendChild(row);
  }
}

// upload panel
const sendPanel = document.createElement("div"); sendPanel.dataset.panel = "send"; sendPanel.setAttribute("role", "tabpanel"); sendPanel.hidden = true; panels.appendChild(sendPanel); tabEls.send = sendPanel;
sendPanel.innerHTML = `
  <div class="group">
    <h2>Send to Claude</h2>
    <div class="field"><label for="plumeName">Name</label><input type="text" id="plumeName" maxlength="60" placeholder="e.g. Hotter ACES II"></div>
    <div class="field"><label for="plumeNote">Note for Claude (optional)</label><input type="text" id="plumeNote" maxlength="300" placeholder="What you changed, or what you want"></div>
    <div class="btnrow"><button class="btn primary" id="uploadBtn" type="button">Upload plume</button><button class="btn" id="copyBtn" type="button">Copy config</button></div>
    <div class="status" id="sendStatus" role="status"></div>
  </div>
  <div class="group">
    <h2>Config (EJECTION_PLUME)</h2>
    <textarea id="cfgOut" readonly spellcheck="false" aria-label="Plume config"></textarea>
  </div>
  <div class="group">
    <h2>Uploaded plumes</h2>
    <ul class="sent" id="sentList"></ul>
    <div class="empty" id="sentEmpty">Nothing uploaded yet. Uploads appear here, and Claude reads them from the same list.</div>
  </div>`;

for (const b of document.querySelectorAll(".tab")) b.addEventListener("click", () => {
  for (const o of document.querySelectorAll(".tab")) o.setAttribute("aria-selected", String(o === b));
  for (const k in tabEls) tabEls[k].hidden = k !== b.dataset.tab;
  if (b.dataset.tab === "send") $("cfgOut").value = configText();
  storeSet("plume-workshop-tab", b.dataset.tab);
});
(function () { const t = storeGet("plume-workshop-tab"); const b = t && document.querySelector('.tab[data-tab="' + t + '"]'); if (b) b.click(); })();

function syncInputs() { for (const k in inputs) inputs[k].set(P[k]); }
function changed(prm) {
  if (["offX", "offY", "offZ", "pitch", "splay", "flameLength", "flameWidth", "coreLength", "coreWidth", "bodyOpacity", "outerOpacity", "glowSize", "glowBrightness", "coreColor", "flameColor", "edgeColor"].includes(prm.key)) rebuildFx();
  updateReadouts();
  if (!prm.preview) persist();
  const out = $("cfgOut"); if (out && !tabEls.send.hidden) out.value = configText();
}
function updateReadouts() {
  const L = 1.2 * P.flameLength, W = 0.42 * P.flameWidth;
  chipSeat.textContent = seat.title + " · " + seat.nozzles.length + (seat.nozzles.length > 1 ? " nozzles" : " nozzle");
  chipSize.textContent = "flame " + L.toFixed(2) + " m × " + W.toFixed(2) + " m";
  const r = $("fitReadout");
  if (r) {
    const list = nozzleList();
    r.textContent = list.map((n, i) => "nozzle " + (i + 1) + "  pos " + n.pos.map(v => v.toFixed(3)).join(", ") + "  dir " + n.dir.map(v => v.toFixed(2)).join(", ")).join("\n");
    r.style.whiteSpace = "pre-wrap";
  }
}
seatSel.addEventListener("change", () => {
  saved[seat.id] = P;
  seat = SEATS.find(s => s.id === seatSel.value) || SEATS[0];
  P = Object.assign(defaults(seat), saved[seat.id] || {});
  P.airspeed = P.airspeed || 40;
  syncInputs(); buildSeat(); rebuildFx(); persist();
});
$("resetBtn").addEventListener("click", () => { const air = P.airspeed; P = defaults(seat); P.airspeed = air; delete saved[seat.id]; syncInputs(); buildSeat(); rebuildFx(); persist(); });
fireBtn.addEventListener("click", ignite);
$("loopBtn").addEventListener("click", e => { loop = !loop; e.currentTarget.setAttribute("aria-pressed", String(loop)); });
$("skySel").addEventListener("change", e => setSky(e.target.value));
$("kerbalBtn").addEventListener("click", e => { kerbalGroup.visible = !kerbalGroup.visible; e.currentTarget.setAttribute("aria-pressed", String(kerbalGroup.visible)); });
$("viewBtn").addEventListener("click", resetView);

// ---------------------------------------------------------------- config text
const SAVE_KEYS = PARAMS.filter(p => !p.preview).map(p => p.key);
const CFG_NAMES = { offX: null, offY: null, offZ: null };
function num(v) { return (Math.round(v * 1000) / 1000).toString(); }
function configText() {
  const name = ($("plumeName") && $("plumeName").value.trim()) || "";
  const lines = ["EJECTION_PLUME", "{", "\tseat = " + seat.id + "   // " + seat.title];
  if (name) lines.push("\tname = " + name.replace(/[{}\/\n\r=]/g, " "));
  lines.push("\tnozzleOffset = " + [P.offX, P.offY, P.offZ].map(num).join(", ") + "   // metres; x mirrors on twin nozzles");
  lines.push("\tnozzlePitch = " + num(P.pitch));
  lines.push("\tnozzleSplay = " + num(P.splay));
  for (const k of SAVE_KEYS) {
    if (k in CFG_NAMES || k === "pitch" || k === "splay") continue;
    const v = P[k];
    lines.push("\t" + k + " = " + (Array.isArray(v) ? v.map(num).join(", ") : num(v)));
  }
  lines.push("}");
  return lines.join("\n");
}
$("copyBtn") && $("copyBtn").addEventListener("click", async () => {
  const text = configText(), out = $("cfgOut"); out.value = text;
  try { await navigator.clipboard.writeText(text); status("Config copied.", true); }
  catch (e) { out.focus(); out.select(); status("Couldn't copy automatically. The config is selected, press Ctrl+C.", false); }
});
function status(msg, ok) { const s = $("sendStatus"); s.textContent = msg; s.className = "status " + (ok ? "ok" : "bad"); }

// ---------------------------------------------------------------- upload (db capability)
let db = null;
const uploadBtn = $("uploadBtn");
uploadBtn.disabled = true;
status("Connecting to the upload list…", true);
const loadTimer = setTimeout(() => { if (!db) status("Uploads aren't available here. Use Copy config and paste it to Claude instead.", false); }, 10000);
let listed = [];
(async () => {
  try { db = window.claude && window.claude.use ? await window.claude.use("db") : null; } catch (e) { db = null; }
  if (!db) { clearTimeout(loadTimer); status("Uploads aren't available here. Use Copy config and paste it to Claude instead.", false); return; }
  uploadBtn.disabled = false; status("", true);
  const listTimer = setTimeout(() => { if (!listed.length) $("sentEmpty").textContent = "Couldn't reach the upload list yet. It may still be loading."; }, 10000);
  db.collection("plumes").orderBy("created", "desc").limit(50).onSnapshot(snap => {
    clearTimeout(listTimer); clearTimeout(loadTimer);
    listed = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
    renderSent();
  }, err => { clearTimeout(listTimer); $("sentEmpty").textContent = "The upload list stopped updating (" + err.code + "). Reload the page to try again."; });
})();
function renderSent() {
  const ul = $("sentList"); ul.textContent = "";
  $("sentEmpty").hidden = listed.length > 0;
  for (const d of listed) {
    const li = document.createElement("li");
    const nm = document.createElement("div"); nm.className = "name"; nm.textContent = (d.name || "Untitled plume") + " · " + (d.seatTitle || d.seat || "");
    const meta = document.createElement("div"); meta.className = "meta";
    meta.textContent = (d.created ? new Date(d.created).toLocaleString() : "") + (d.status ? " · " + d.status : "");
    const b = document.createElement("button"); b.className = "btn"; b.type = "button"; b.textContent = "Load";
    b.addEventListener("click", () => loadUpload(d));
    li.append(nm, b, meta); ul.appendChild(li);
  }
}
function loadUpload(d) {
  const s = SEATS.find(x => x.id === d.seat); if (!s || !d.params || typeof d.params !== "object") { status("That upload can't be loaded.", false); return; }
  saved[seat.id] = P; seat = s; seatSel.value = s.id;
  const base = defaults(s);
  for (const k of SAVE_KEYS) { const v = d.params[k]; if (Array.isArray(base[k]) ? Array.isArray(v) && v.length === 3 && v.every(Number.isFinite) : Number.isFinite(v)) base[k] = v; }
  base.airspeed = P.airspeed; P = base;
  if ($("plumeName")) $("plumeName").value = typeof d.name === "string" ? d.name : "";
  syncInputs(); buildSeat(); rebuildFx(); persist(); status("Loaded “" + (d.name || "Untitled plume") + "”.", true);
}
uploadBtn.addEventListener("click", async () => {
  if (!db) return;
  const name = $("plumeName").value.trim().slice(0, 60) || (seat.title + " plume");
  const note = $("plumeNote").value.trim().slice(0, 300);
  const params = {}; for (const k of SAVE_KEYS) params[k] = P[k];
  uploadBtn.disabled = true; status("Uploading…", true);
  try {
    await db.collection("plumes").add({ seat: seat.id, seatTitle: seat.title, name, note, params, cfg: configText(), created: new Date().toISOString() });
    status("Uploaded. Tell Claude it's there and it'll add it to the mod.", true);
  } catch (e) {
    status(e && e.code === "quota_exceeded" ? "The upload list is full. Ask Claude to clear old uploads." : "Upload failed (" + ((e && e.code) || "error") + "). Use Copy config instead.", false);
  } finally { uploadBtn.disabled = false; }
});

// ---------------------------------------------------------------- go
try {
  syncInputs(); buildSeat(); rebuildFx(); resize(); ignite();
  requestAnimationFrame(frame);
  loadModels();
} catch (e) { showError(e); }
})();
function showError(e) {
  const d = document.createElement("div");
  d.style.cssText = "position:absolute;left:16px;right:16px;top:56px;padding:12px;font:13px/1.4 monospace;color:#ffd9cf;background:rgba(90,20,10,0.85);border-radius:4px;white-space:pre-wrap";
  d.textContent = "The 3D preview failed to start. Send Claude this message:\n" + (e && e.stack ? e.stack : String(e));
  const s = document.getElementById("stage"); if (s) s.appendChild(d);
}
window.addEventListener("error", ev => { if (!document.querySelector("#stage > div[style*='90,20,10']")) showError(ev.error || ev.message); });
