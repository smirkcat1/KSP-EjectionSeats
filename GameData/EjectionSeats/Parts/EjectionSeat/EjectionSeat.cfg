// The spent ejection seat. It can't be built: the mod creates it when a seat separates from its kerbal.
// The model is generated in game (the .mu file only holds the collider), so it matches the seat type
// that was fitted, and its stock or ReStock look.
PART
{
	name = EjectionSeat
	module = Part
	author = Ejection Seats
	MODEL
	{
		model = EjectionSeats/Parts/EjectionSeat/seat
	}
	rescaleFactor = 1
	TechRequired = Unresearcheable
	TechHidden = True
	entryCost = 0
	cost = 450
	category = none
	subcategory = 0
	title = Ejection Seat
	manufacturer = Ejection Seats
	description = A spent ejection seat with its solid rocket motor. Only made when a kerbal ejects.
	attachRules = 0,0,0,0,0
	mass = 0.05
	dragModelType = default
	maximum_drag = 0.3
	minimum_drag = 0.2
	angularDrag = 1
	crashTolerance = 14
	breakingForce = 50
	breakingTorque = 50
	maxTemp = 1200
	explosionPotential = 0.3
	vesselType = Debris
	tags = ejection seat
	RESOURCE
	{
		name = SolidFuel
		amount = 1.5
		maxAmount = 1.5
	}
	MODULE
	{
		name = ModuleEjectionSeatPart
	}
	DRAG_CUBE
	{
		cube = Default, 0.208,0.85,0.34, 0.208,0.85,0.34, 0.104,0.85,0.68, 0.104,0.85,0.68, 0.231,0.85,0.306, 0.231,0.85,0.306, 0,0.204,-0.054, 0.34,0.68,0.306
	}
}
