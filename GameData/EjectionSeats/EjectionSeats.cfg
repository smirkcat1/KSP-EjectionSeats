// Ejection Seats: adds the (dormant) ejection seat module to every crewed command part from every mod.
// Nothing changes on a part until you right-click it in the VAB/SPH and press "Install ejection seats".
// Requires ModuleManager.

@PART[*]:HAS[@MODULE[ModuleCommand],#CrewCapacity[>0],!MODULE[ModuleEjectionSeat],!MODULE[KerbalEVA]]:FINAL
{
    MODULE
    {
        name = ModuleEjectionSeat
    }
}
