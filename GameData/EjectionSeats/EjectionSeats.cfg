// Ejection Seats: adds the (dormant) ejection seat module to every crewed part from every mod:
// cockpits and command pods, and crew cabins such as the Mk1 Crew Cabin or the Mk3 Passenger Module.
// Nothing changes on a part until you right-click it in the VAB/SPH and press "Install ejection seats".
// Requires ModuleManager.

@PART[*]:HAS[#CrewCapacity[>0],!MODULE[ModuleEjectionSeat],!MODULE[KerbalEVA],!MODULE[KerbalSeat]]:FINAL
{
    MODULE
    {
        name = ModuleEjectionSeat
    }
}
