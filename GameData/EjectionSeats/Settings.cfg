// Ejection Seats - global settings.
// This file is re-read while the game runs (every ~2 s, on the next ejection/preview),
// so you can tweak values with KSP open.

EJECTION_SEAT_SETTINGS
{
    // ---- cost / mass of an installed seat set (per crew seat) ----
    seatMassPerCrew = 0.08
    seatCostPerCrew = 450

    // ---- cockpit analysis ----
    // A cylinder ("escape column") of this radius is cut through the hull above each seat,
    // starting this many metres above the seat. Everything inside it is blown off.
    hatchRadius = 0.48
    hatchStartHeight = 0.5
    // Large hull triangles near the column are split to roughly this size so the hole is round.
    subdivideEdge = 0.2
    // Canopy detection: meshes scoring >= canopyMinScore are detached whole.
    // strong words +5, weak words +3, transparent shader +3, on the ejection path +3, above the seat +2.
    canopyMinScore = 6
    strongCanopyWords = canopy, bubble
    weakCanopyWords = glass, window, windshield, windscreen, hatch, door, lid, visor
    // meshes whose names contain these are never treated as a canopy (flag decals, lights...)
    ignoreCanopyWords = flag, decal, light, lamp, emissive, beacon
    // only cut surfaces whose normal is within ~70 deg of the escape axis (roof/canopy), keeping side walls
    cutMinFacing = 0.35
    // faint cabin light so the exposed interior isn't pitch black (0 = off)
    interiorGlow = 0.3
    canopyDrag = 0.08         // CdA m^2 - low so the canopy sails away instead of stopping dead
    canopyMass = 0.08
    canopyTrailTime = 1.4     // jettison motor burn (flame, glow, smoke trail, thrust)
    canopyEjectSpeed = 14
    canopyBackSpeed = 4
    canopySpin = 3
    // Ejection axis: false = straight along the IVA seat's own "up" (aircraft seats fire up through the
    // canopy, capsule crews fire the way they face, e.g. out of the front of a crew capsule).
    // true = also try the craft's "up" and a blend of both, and use whichever gives the cleanest path.
    preferVehicleUp = false
    vehicleUpWeight = 0.35

    // ---- sequence timing (seconds) ----
    prepTime = 0.3            // canopy away -> first seat moves
    sitDownTime = 0.45        // kerbal settles into the seat
    sequenceInterval = 0.35   // stagger between seats in multi-crew cockpits
    railExtraLength = 0.8     // catapult rail continues this far past the hull
    separationDelay = 0.9     // after rocket burnout -> seat/man separation
    // While strapped in, KSP's (very high) EVA-kerbal drag is replaced by seat+kerbal drag:
    seatDragArea = 0.25       // CdA m^2 - ~1 g of drag at 100 m/s; raise to make seats fall behind sooner
    // After separation (until KSP takes over near the ground) the kerbal uses this instead of KSP's EVA drag:
    kerbalDragArea = 0.3
    seatMass = 0.06           // tonnes
    kerbalsFeelGForce = false // true = KSP's G-LOC rules apply during the burn

    // ---- kerbal / seat placement ----
    // Where the EVA kerbal sits relative to the IVA seat transform (seat frame: x right, y up, z forward).
    ivaToEvaOffset = 0, 0.08, 0
    // Fit the seat to the kerbal automatically by measuring its pelvis/backpack in the seated pose.
    // kerbalFitAdjust nudges the result (x right, y up, z forward; seat moves by this relative to the kerbal).
    autoFitKerbal = true
    kerbalFitAdjust = 0, 0, 0
    pelvisAboveCushion = 0.06
    packHalfDepth = 0.06
    // Overall seat model size (1 = human-sized, ~0.68 = kerbal-sized).
    seatScale = 0.68
    // Where the seat model sits relative to the EVA kerbal (kerbal local frame: x right, y up, z forward).
    // More negative y = kerbal sits deeper in the seat; more negative z = seat further behind the kerbal.
    kerbalSeatOffset = 0, -0.40, -0.05
    kerbalSeatRotation = 0, 0, 0
    // KSP's IVA -> part rotation (InternalModel.internalToWorld). Don't change unless debugging.
    internalRotation = 90, 180, 0

    // ---- kerbal animations ----
    // Either a field name of KerbalAnimationManager (seatIdle, chuteIdle, swimIdle, idle, ...) or a raw clip name.
    // Set debug = true to print every clip name the EVA kerbal has to KSP.log.
    animBrace = idle
    animSeated = seatIdle
    animFreefall = swimIdle
    animChute = chuteIdle
    animLanded = idle

    // ---- parachute ----
    // The canopy model is taken from a stock parachute part (so ReStock etc. restyle it); lines/risers are custom.
    // Each seat model picks one (ACES II/US16E: parachuteRadial, K-36D/KM-1: parachuteLarge, the others: parachuteSingle).
    // Set this to force one part for all seats, e.g. parachuteLarge. Empty = per seat model.
    chutePart =
    // below this height above ground the kerbal's own EVA controller takes over for touchdown
    handoverAltitude = 25
    // impact speed (m/s) an ejected kerbal survives while the sequence runs
    kerbalCrashTolerance = 50
    chuteDiameter = 6
    chuteDescentRate = 7      // m/s at sea-level Kerbin density
    chuteMaxG = 12            // opening shock limit
    chuteMinDensity = 0.002   // below this (kg/m^3) the chute is not deployed
    // where the risers meet the kerbal (behind the helmet, at shoulder height)
    chuteRiserPoint = 0, 0.05, -0.26
    // share of the chute's open time (set per seat in the editor) spent semi-deployed / reefed
    chuteSemiFraction = 0.45

    // ---- effects ----
    // Seat look: auto = ReStock style when ReStock is installed, otherwise stock style. Or force stock / restock.
    seatTheme = auto
    // Layered rocket flame (white-hot core, shock diamonds, outer flame, nozzle glow, embers).
    enhancedFlames = true
    flameScale = 1
    // Thick solid-rocket smoke trail from the seat motor (replaces the thin BDArmory/built-in trail).
    srbSmoke = true
    srbSmokeAmount = 1     // more or less smoke (particle count)
    srbSmokeLifetime = 9   // seconds the trail hangs in the air
    // With BDArmory installed and srbSmoke off, the seat rockets use its missile exhaust for smoke.
    useBDAPlumes = true
    plumePrefab = BDArmory/Models/exhaust/smallExhaust
    plumeScale = 0.45
    plumeRotation = 0, 0, 0
    rocketSound = Squad/Sounds/sound_rocket_mini
    canopySound = Squad/Sounds/sound_decoupler_fire

    // ---- misc ----
    focusEjectedKerbal = true  // camera follows the first ejected kerbal
    // Respawn helmetless kerbals sitting in an opened cockpit so they wear one (never during an ejection).
    // Set false if another IVA mod misbehaves when IVA kerbals are respawned.
    ivaHelmetRespawn = true
    restoreCollisionsAfter = 4 // seconds before the kerbal can collide with its old vessel again
    debrisLifetime = 45
    seatLifetime = 60      // only used when seatAsPart is false
    // The separated seat becomes a real "Ejection Seat" part (leftover SolidFuel, KSP aero, breaks up on hard
    // impact). It can't be built in the editor. False: a simple physics object that vanishes after seatLifetime.
    seatAsPart = true
    // Braced posture and hands on the firing handle in the seat; KSP's parachute animations under the canopy.
    kerbalPoses = true
    maxInteriorRenderers = 1500
    debug = true   // logs seat-fit measurements, canopy scoring and interpolation to KSP.log (turn off for release)
}
