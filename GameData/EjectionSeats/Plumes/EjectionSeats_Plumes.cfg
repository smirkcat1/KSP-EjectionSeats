// Seat rocket plumes that ship with Ejection Seats, in the style of solid motors in real seat tests:
// a short, white-hot jet at the nozzle with a big glow, running straight into thick billowing smoke.
// Modern motors burn cleaner (tan smoke), older ones dirtier (grey-brown), WWII cartridges orange with dark smoke.
// Add your own EJECTION_PLUME files to this folder to override these (later files win). See README.txt.

